<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Contact de Tiffany</title>
  </head>

  <body>
    <header>
      <h1>Me contacter</h1>
      <nav>
        <a href="tel:0672171522">Téléphone</a>
        <a href="mailto:tiffany.jautrou@gmail.com">Mail</a>
        <a href="https://www.linkedin.com/in/tiffany-jautrou-505b29137/?isSelfProfile=true" target="_blank">LinkedIn</a>
        <a href="https://github.com/Tiffanyjautrou" target="_blank">GitHub</a>
        <a href="main.html" target="_blank">Retour au CV</a>
        <script src="js/sombre.js" defer></script>
        <button id="theme">Mode sombre</button>
      </nav>
    </header>

    <main>
      <form>
      <div>
        <label for="prenom">Prénom</label>
        <input
          type="text"
          id="prenom"
          name="prenom"
          placeholder="Prénom"
          required>
      </div>
        <br />

        <label for="email">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="E-mail"
          required
        />
        <br />

        <label for="sujet">Sujet</label>
        <select id="sujet" name="sujet">
          <option>Alternance</option>
          <option>Stage</option>
          <option>Autres</option>
        </select>
        <br />

        <label for="msg">Message</label>
        <br />
        <textarea
          id="msg"
          name="msg"
          rows="4"
          placeholder="Votre texte"
        ></textarea>
        <br />

        <div class="coche">

        <input type="checkbox" id="recontact" name="recontact"/>
        <label for="recontact">J'accepte d'être recontacté(e)</label>
        <br />

      </div> 

        <button type="submit">Envoyer</button>
      </form>
    </main>

    <footer>© 2026 Tiffany</footer>
  </body>
</html>
